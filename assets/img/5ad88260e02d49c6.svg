<svg xmlns="http://www.w3.org/2000/svg" width="473" height="20" role="img" aria-label="宁静而又相当明亮的浅天蓝色，介于天蓝色和婴儿蓝之间，因其亮度而带有一丝轻微的荧光感。"><title>宁静而又相当明亮的浅天蓝色，介于天蓝色和婴儿蓝之间，因其亮度而带有一丝轻微的荧光感。</title><filter id="blur"><feGaussianBlur stdDeviation="16"/></filter><linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="473" height="20" rx="3"/></clipPath><g clip-path="url(#r)"><rect width="0" height="20" fill="#66ccff"/><rect x="0" width="473" height="20" fill="#66ccff"/><rect width="473" height="20" fill="url(#s)"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110"><g transform="scale(.1)"><g aria-hidden="true" fill="#ccc"><text x="2365" y="150" fill-opacity=".8" filter="url(#blur)" textLength="4630">宁静而又相当明亮的浅天蓝色，介于天蓝色和婴儿蓝之间，因其亮度而带有一丝轻微的荧光感。</text><text x="2365" y="150" fill-opacity=".3" textLength="4630">宁静而又相当明亮的浅天蓝色，介于天蓝色和婴儿蓝之间，因其亮度而带有一丝轻微的荧光感。</text></g><text x="2365" y="140" textLength="4630" fill="#333">宁静而又相当明亮的浅天蓝色，介于天蓝色和婴儿蓝之间，因其亮度而带有一丝轻微的荧光感。</text></g></g></svg>